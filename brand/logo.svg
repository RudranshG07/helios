<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#13161b"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#37c9a0"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d6fff0"/>
      <stop offset="55%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#2fae89"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" rx="92" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="397" height="397" rx="90.5" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- sun rays = the Helios mark -->
  <g transform="translate(200 200)" filter="url(#glow)">
    <g fill="url(#ray)">
      <!-- 8 rays as tapered diamonds -->
      <g>
        <path d="M0 -132 L13 -78 L0 -64 L-13 -78 Z"/>
        <path d="M0 132 L13 78 L0 64 L-13 78 Z"/>
        <path d="M-132 0 L-78 -13 L-64 0 L-78 13 Z"/>
        <path d="M132 0 L78 -13 L64 0 L78 13 Z"/>
      </g>
      <g transform="rotate(45)">
        <path d="M0 -120 L11 -72 L0 -60 L-11 -72 Z" opacity="0.85"/>
        <path d="M0 120 L11 72 L0 60 L-11 72 Z" opacity="0.85"/>
        <path d="M-120 0 L-72 -11 L-60 0 L-72 11 Z" opacity="0.85"/>
        <path d="M120 0 L72 -11 L60 0 L72 11 Z" opacity="0.85"/>
      </g>
    </g>
    <!-- core with an upward trend notch -->
    <circle r="46" fill="url(#core)"/>
    <path d="M-22 12 L-6 -4 L4 6 L22 -16" fill="none" stroke="#0a0b0d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="-16" r="5" fill="#0a0b0d"/>
  </g>
</svg>
